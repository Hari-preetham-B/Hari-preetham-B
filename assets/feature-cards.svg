<svg width="1200" height="240" viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="cardGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="iconGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="240" fill="#0a0e17"/>

  <!-- section label -->
  <text x="18" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#f472b6">✦ What I Do</text>

  <!-- card template repeated x4 -->
  <!-- Card 1: Computer Vision -->
  <g transform="translate(18,44)">
    <rect width="278" height="180" rx="16" fill="#10131f" stroke="url(#cardBorder)" stroke-width="1.4"/>
    <circle cx="139" cy="52" r="34" fill="url(#iconGlow)"/>
    <text x="139" y="63" font-size="30" text-anchor="middle" filter="url(#cardGlow)">👁️</text>
    <text x="139" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#e5e7eb" text-anchor="middle">Computer Vision</text>
    <text x="139" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#9ca3af" text-anchor="middle">
      <tspan x="139" dy="0">YOLOv8 &amp; CNN pipelines for</tspan>
      <tspan x="139" dy="18">real-time detection systems</tspan>
    </text>
  </g>

  <!-- Card 2: Full-Stack AI Apps -->
  <g transform="translate(308,44)">
    <rect width="278" height="180" rx="16" fill="#10131f" stroke="url(#cardBorder)" stroke-width="1.4"/>
    <circle cx="139" cy="52" r="34" fill="url(#iconGlow)"/>
    <text x="139" y="63" font-size="30" text-anchor="middle" filter="url(#cardGlow)">🌐</text>
    <text x="139" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#e5e7eb" text-anchor="middle">Full-Stack AI Apps</text>
    <text x="139" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#9ca3af" text-anchor="middle">
      <tspan x="139" dy="0">React/Vite + Flask/FastAPI</tspan>
      <tspan x="139" dy="18">with Supabase &amp; JWT auth</tspan>
    </text>
  </g>

  <!-- Card 3: GenAI & LLM Systems -->
  <g transform="translate(598,44)">
    <rect width="278" height="180" rx="16" fill="#10131f" stroke="url(#cardBorder)" stroke-width="1.4"/>
    <circle cx="139" cy="52" r="34" fill="url(#iconGlow)"/>
    <text x="139" y="63" font-size="30" text-anchor="middle" filter="url(#cardGlow)">🤖</text>
    <text x="139" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#e5e7eb" text-anchor="middle">GenAI &amp; LLM Systems</text>
    <text x="139" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#9ca3af" text-anchor="middle">
      <tspan x="139" dy="0">Prompt engineering, agents</tspan>
      <tspan x="139" dy="18">&amp; multi-model routing</tspan>
    </text>
  </g>

  <!-- Card 4: Embedded / IoT -->
  <g transform="translate(888,44)">
    <rect width="278" height="180" rx="16" fill="#10131f" stroke="url(#cardBorder)" stroke-width="1.4"/>
    <circle cx="139" cy="52" r="34" fill="url(#iconGlow)"/>
    <text x="139" y="63" font-size="30" text-anchor="middle" filter="url(#cardGlow)">🔌</text>
    <text x="139" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#e5e7eb" text-anchor="middle">Embedded / IoT</text>
    <text x="139" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#9ca3af" text-anchor="middle">
      <tspan x="139" dy="0">Sensor fusion &amp; PID control</tspan>
      <tspan x="139" dy="18">powering my WRO 2026 car</tspan>
    </text>
  </g>
</svg>
